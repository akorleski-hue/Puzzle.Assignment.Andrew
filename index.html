<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Andrew - Flexbox & CSS Grid Puzzle Assignment</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #e2e8f0;
      color: #1e293b;
      display: flex;
      justify-content: center;
      padding: 30px;
    }

    /* CSS GRID PAGE LAYOUT */
    .grid-container {
      display: grid;
      grid-template-rows: auto 1fr auto;
      grid-template-areas:
        "header"
        "puzzle"
        "footer";
      gap: 20px;
      max-width: 800px;
      width: 100%;
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }

    .header-section {
      grid-area: header;
      text-align: center;
      border-bottom: 2px solid #cbd5e1;
      padding-bottom: 15px;
    }

    .puzzle-section {
      grid-area: puzzle;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .footer-section {
      grid-area: footer;
      text-align: center;
      border-top: 2px solid #cbd5e1;
      padding-top: 15px;
      color: #475569;
    }

    /* FLEXBOX PUZZLE CONTAINER (4 Columns x 3 Rows) */
    .flex-puzzle {
      display: flex;
      flex-wrap: wrap;
      box-sizing: content-box;
      width: 600px;
      border: 4px solid #0f172a;
    }

    .flex-puzzle img {
      display: block;
      width: 150px;
      height: auto;
    }

    /* HIDE THE TRICK PIECE (puzzle2_M.jpg) */
    .hidden-piece {
      display: none;
    }

    /* SOLVED FLEX ORDER */
    .piece-A { order: 2; }
    .piece-B { order: 3; }
    .piece-C { order: 8; }
    .piece-D { order: 4; }
    .piece-E { order: 1; }
    .piece-F { order: 9; }
    .piece-G { order: 6; }
    .piece-H { order: 11; }
    .piece-I { order: 12; }
    .piece-J { order: 10; }
    .piece-K { order: 7; }
    .piece-L { order: 5; }
  </style>
</head>
<body>

  <div class="grid-container">
    <header class="header-section">
      <h1>Name: Andrew</h1>
      <p>Selected Puzzle: <strong>Snowmen</strong></p>
    </header>

    <main class="puzzle-section">
      <div class="flex-puzzle">
        <img src="puzzle2_A.jpg" alt="Puzzle piece A" class="piece-A">
        <img src="puzzle2_B.jpg" alt="Puzzle piece B" class="piece-B">
        <img src="puzzle2_C.jpg" alt="Puzzle piece C" class="piece-C">
        <img src="puzzle2_D.jpg" alt="Puzzle piece D" class="piece-D">
        <img src="puzzle2_E.jpg" alt="Puzzle piece E" class="piece-E">
        <img src="puzzle2_F.jpg" alt="Puzzle piece F" class="piece-F">
        <img src="puzzle2_G.jpg" alt="Puzzle piece G" class="piece-G">
        <img src="puzzle2_H.jpg" alt="Puzzle piece H" class="piece-H">
        <img src="puzzle2_I.jpg" alt="Puzzle piece I" class="piece-I">
        <img src="puzzle2_J.jpg" alt="Puzzle piece J" class="piece-J">
        <img src="puzzle2_K.jpg" alt="Puzzle piece K" class="piece-K">
        <img src="puzzle2_L.jpg" alt="Puzzle piece L" class="piece-L">
        <img src="puzzle2_M.jpg" alt="Faulty trick piece" class="hidden-piece">
      </div>
    </main>

    <footer class="footer-section">
      <p>Completed on: November 20, 2026</p>
    </footer>
  </div>

</body>
</html>
